<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold War Jets</title>
</head>

<body>
    <h2>List of Cold War BOMBERS</h2>

    <p id="planes"></p>

    <script>
        const bombers =
            [
                [make = "Boeing", type = "B", model = 29, name = "Superfortress"],
                [make = "Boeing", type = "B", model = 36, name = "Peacemaker"]
            ];

        let txt = "";
        bombers.forEach(myFunction);
        document.getElementById("planes").innerHTML = txt;

        function myFunction(make, type, model, name) {
            txt += make + " " + type + " " + model + " " + name + "<br>";
        }

    </script>
</body>

</html>
